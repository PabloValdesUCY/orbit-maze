; EPL428 Lab 3 -- separate focused project; do not overwrite last week's project.
[platformio]
default_envs = t-beams3-supreme
boards_dir = boards
src_dir = student/05_Project
; src_dir = student/02_Motion
; src_dir = student/03_Dashboard
; src_dir = student/04_Pedometer

[env:t-beams3-supreme]
platform = platformio/espressif32@6.12.0
board = t-beams3-supreme
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters = default
lib_ldf_mode = chain+
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLILYGO_TBeamS3_SUPREME_V3_0
    -DBOARD_HAS_PSRAM
; No remote lib_deps: use the three supplied, versioned local library snapshots.
; First build still needs the pinned PlatformIO platform/framework/toolchain.
